openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Survivor Guessing Game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Custom email/password auth (mobile)
  - name: users
    description: User management
  - name: admin
    description: Admin-only endpoints
  - name: games
    description: Game management
  - name: contestants
    description: Contestant management
  - name: show-tribes
    description: Show tribes (the cast's tribes on the show)
  - name: weeks
    description: Week management
  - name: questions
    description: Question management
  - name: choices
    description: Question choice management
  - name: answers
    description: Player answers
  - name: correct-answers
    description: Admin correct answers
  - name: survivor-picks
    description: Survivor pick management
  - name: leaderboard
    description: Leaderboard
  - name: storage
    description: Object storage upload and serving endpoints
  - name: tribes
    description: Player tribes (groups joined by 5-character code)
  - name: notifications
    description: Push notification tokens and admin broadcasts
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create a new mobile-app account with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpBody"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
        "409":
          description: Email already in use

  /auth/signin:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInBody"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Incorrect email or password

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset email (always returns 200 to avoid email enumeration)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordBody"
      responses:
        "200":
          description: Reset email queued (returned even if email is unknown)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Complete password reset using the emailed code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        "200":
          description: Password reset and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid or expired code

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users (admin only)
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAdminUsersResponse"

  /admin/users/{userId}/role:
    patch:
      operationId: updateAdminUserRole
      tags: [admin]
      summary: Change a user's role (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserRoleBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/users/{userId}:
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Delete a user (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMyProfile
      tags: [users]
      summary: Update current user profile (display name)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    delete:
      operationId: deleteMyAccount
      tags: [users]
      summary: Permanently delete the current user's account and all associated data
      responses:
        "204":
          description: Account deleted
        "401":
          description: Unauthorized

  /users/me/push-token:
    put:
      operationId: registerPushToken
      tags: [notifications]
      summary: Register (or re-register) an Expo push token for the current user's device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenBody"
      responses:
        "204":
          description: Token registered
        "401":
          description: Unauthorized
    delete:
      operationId: unregisterPushToken
      tags: [notifications]
      summary: Remove an Expo push token (user turned notifications off on this device)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenBody"
      responses:
        "204":
          description: Token removed
        "401":
          description: Unauthorized

  /users/me/notification-settings:
    patch:
      operationId: updateNotificationSettings
      tags: [notifications]
      summary: Update the current user's notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationSettingsBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /notifications/broadcast:
    post:
      operationId: sendBroadcast
      tags: [notifications]
      summary: "Admin: send a custom push notification to all players with notifications enabled"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastBody"
      responses:
        "200":
          description: Broadcast queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastResult"
        "401":
          description: Unauthorized
        "403":
          description: Admin only

  /users/me/avatar:
    patch:
      operationId: updateMyAvatar
      tags: [users]
      summary: Set or clear the current user's profile picture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyAvatarBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /users/me/role:
    patch:
      operationId: updateMyRole
      tags: [users]
      summary: Update current user role (used during registration)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /games:
    get:
      operationId: listGames
      tags: [games]
      summary: List all games
      responses:
        "200":
          description: List of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
    post:
      operationId: createGame
      tags: [games]
      summary: Create a new game (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameBody"
      responses:
        "201":
          description: Created game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /games/{gameId}:
    get:
      operationId: getGame
      tags: [games]
      summary: Get a game by ID
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Not found
    patch:
      operationId: updateGame
      tags: [games]
      summary: Update a game (admin only)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGameBody"
      responses:
        "200":
          description: Updated game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /games/{gameId}/delete:
    post:
      operationId: deleteGame
      tags: [games]
      summary: Delete a game and all its data (admin only)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Not found

  /games/{gameId}/seed:
    post:
      operationId: seedGame
      tags: [games]
      summary: Seed a game with sample contestants, weeks, and questions (admin only)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Seeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Not found

  /games/{gameId}/clear:
    post:
      operationId: clearGame
      tags: [games]
      summary: Remove all contestants, weeks, questions, and answers from a game (admin only)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          description: Not found

  /games/{gameId}/contestants:
    get:
      operationId: listContestants
      tags: [contestants]
      summary: List contestants for a game
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of contestants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contestant"
    post:
      operationId: createContestant
      tags: [contestants]
      summary: Add a contestant to a game (admin only)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContestantBody"
      responses:
        "201":
          description: Created contestant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contestant"

  /contestants/{contestantId}:
    patch:
      operationId: updateContestant
      tags: [contestants]
      summary: Update a contestant — currently used to set/clear the headshot photo (admin only)
      parameters:
        - name: contestantId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContestantBody"
      responses:
        "200":
          description: Updated contestant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contestant"
    delete:
      operationId: deleteContestant
      tags: [contestants]
      summary: Delete or archive a contestant (admin only)
      description: |
        Deletes the contestant outright when no picks or answers reference
        them. Otherwise the contestant is archived (`isActive = false`) so
        historical scoring stays intact but they no longer appear as a choice
        for new picks.
      parameters:
        - name: contestantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted or archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteContestantResponse"

  /contestants/{contestantId}/restore:
    post:
      operationId: restoreContestant
      tags: [contestants]
      summary: Restore an archived contestant (admin only)
      parameters:
        - name: contestantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored contestant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contestant"

  /games/{gameId}/show-tribes:
    get:
      operationId: listShowTribes
      tags: [show-tribes]
      summary: List show tribes for a game
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of show tribes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShowTribe"
    post:
      operationId: createShowTribe
      tags: [show-tribes]
      summary: Add a show tribe to a game (admin only)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShowTribeBody"
      responses:
        "201":
          description: Created show tribe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowTribe"

  /show-tribes/{showTribeId}:
    patch:
      operationId: updateShowTribe
      tags: [show-tribes]
      summary: Rename a show tribe (admin only)
      parameters:
        - name: showTribeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShowTribeBody"
      responses:
        "200":
          description: Updated show tribe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowTribe"
    delete:
      operationId: deleteShowTribe
      tags: [show-tribes]
      summary: Delete a show tribe (admin only)
      description: Contestants assigned to the tribe keep playing; their tribe simply becomes unassigned.
      parameters:
        - name: showTribeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields
        "500":
          description: Failed to generate upload URL

  /games/{gameId}/weeks:
    get:
      operationId: listWeeks
      tags: [weeks]
      summary: List weeks for a game
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of weeks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Week"
    post:
      operationId: createWeek
      tags: [weeks]
      summary: Create a week (admin only)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWeekBody"
      responses:
        "201":
          description: Created week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Week"

  /weeks/{weekId}:
    get:
      operationId: getWeek
      tags: [weeks]
      summary: Get a week by ID
      parameters:
        - name: weekId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Week"
    patch:
      operationId: updateWeek
      tags: [weeks]
      summary: Update a week's air date (admin only)
      parameters:
        - name: weekId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWeekBody"
      responses:
        "200":
          description: Updated week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Week"
    delete:
      operationId: deleteWeek
      tags: [weeks]
      summary: Delete a week and all its questions/answers (admin only)
      parameters:
        - name: weekId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Week deleted

  /weeks/{weekId}/open:
    post:
      operationId: openWeek
      tags: [weeks]
      summary: Open a week for player answers (admin only)
      parameters:
        - name: weekId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Week opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Week"

  /weeks/{weekId}/close:
    post:
      operationId: closeWeek
      tags: [weeks]
      summary: Revert an open week back to not open (admin only)
      parameters:
        - name: weekId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Week closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Week"

  /weeks/{weekId}/unlock:
    post:
      operationId: unlockWeek
      tags: [weeks]
      summary: |
        Reopen a locked/scored week so the admin can edit answers (admin only).
        Flips isLocked back to false and isOpen to true. Existing player answers
        and correct-answer selections are preserved. Re-submitting correct
        answers will re-score and re-lock the week.
      parameters:
        - name: weekId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Week unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Week"

  /weeks/{weekId}/questions:
    get:
      operationId: listQuestions
      tags: [questions]
      summary: List questions for a week
      parameters:
        - name: weekId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of questions with choices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionWithChoices"
    post:
      operationId: createQuestion
      tags: [questions]
      summary: Create a question (admin only)
      parameters:
        - name: weekId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionBody"
      responses:
        "201":
          description: Created question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionWithChoices"

  /questions/{questionId}:
    patch:
      operationId: updateQuestion
      tags: [questions]
      summary: Update a question (admin only)
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuestionBody"
      responses:
        "200":
          description: Updated question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionWithChoices"
    delete:
      operationId: deleteQuestion
      tags: [questions]
      summary: Delete a question (admin only)
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /questions/{questionId}/choices:
    post:
      operationId: createChoice
      tags: [choices]
      summary: Add a choice to a question (admin only)
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChoiceBody"
      responses:
        "201":
          description: Created choice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Choice"

  /choices/{choiceId}:
    delete:
      operationId: deleteChoice
      tags: [choices]
      summary: Delete a choice (admin only)
      parameters:
        - name: choiceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /weeks/{weekId}/correct-answers:
    get:
      operationId: getCorrectAnswers
      tags: [correct-answers]
      summary: Get correct answers for a week (visible after week is locked)
      parameters:
        - name: weekId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Correct answers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CorrectAnswer"
    post:
      operationId: submitCorrectAnswers
      tags: [correct-answers]
      summary: Submit correct answers for a week (admin only, locks the week)
      parameters:
        - name: weekId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitCorrectAnswersBody"
      responses:
        "200":
          description: Week scored and locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Week"

  /weeks/{weekId}/my-answers:
    get:
      operationId: getMyAnswers
      tags: [answers]
      summary: Get current player's answers for a week
      parameters:
        - name: weekId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player answers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerAnswer"
    post:
      operationId: saveMyAnswers
      tags: [answers]
      summary: Save current player's answers for a week
      parameters:
        - name: weekId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAnswersBody"
      responses:
        "200":
          description: Saved answers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerAnswer"

  /games/{gameId}/survivor-picks:
    get:
      operationId: getMySurvivorPicks
      tags: [survivor-picks]
      summary: Get current player's survivor picks for a game
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Survivor picks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurvivorPicks"
    post:
      operationId: saveSurvivorPicks
      tags: [survivor-picks]
      summary: Save current player's survivor picks
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveSurvivorPicksBody"
      responses:
        "200":
          description: Saved survivor picks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurvivorPicks"

  /games/{gameId}/survivor-winner:
    post:
      operationId: submitSurvivorWinner
      tags: [survivor-picks]
      summary: Submit the actual Survivor winner (admin only, finalizes game)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitSurvivorWinnerBody"
      responses:
        "200":
          description: Winner submitted and game completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /games/{gameId}/leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get leaderboard for a game (optionally scoped to a tribe)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
        - name: tribeId
          in: query
          required: false
          description: When provided, only includes players in this tribe.
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          description: |
            Maximum number of top entries to return. The current user's own
            entry is always included even if their rank falls outside the
            top N. Tribe-scoped requests ignore this parameter and always
            return all tribe members.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /tribes:
    post:
      operationId: createTribe
      tags: [tribes]
      summary: Create a new tribe and join it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTribeBody"
      responses:
        "201":
          description: Created tribe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tribe"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "409":
          description: Already in a tribe

  /tribes/join:
    post:
      operationId: joinTribe
      tags: [tribes]
      summary: Join an existing tribe by code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinTribeBody"
      responses:
        "200":
          description: Joined tribe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tribe"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "404":
          description: No tribe with that code
        "409":
          description: Already in a tribe

  /tribes/me:
    get:
      operationId: getMyTribe
      tags: [tribes]
      summary: Get the current user's tribe (or null if not in one)
      responses:
        "200":
          description: Current tribe or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyTribeResponse"
        "401":
          description: Unauthorized

  /tribes/me/messages:
    get:
      operationId: listTribeMessages
      tags: [tribes]
      summary: List chat messages for the current user's tribe
      parameters:
        - name: afterId
          in: query
          required: false
          schema:
            type: integer
          description: Only return messages with id strictly greater than this value (for polling).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
          description: Maximum number of recent messages to return when afterId is not provided. Defaults to 100.
      responses:
        "200":
          description: Tribe chat messages, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
        "401":
          description: Unauthorized
        "403":
          description: Not in a tribe
    post:
      operationId: sendTribeMessage
      tags: [tribes]
      summary: Send a chat message to the current user's tribe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendTribeMessageBody"
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Not in a tribe

  /games/{gameId}/stats:
    get:
      operationId: getGameStats
      tags: [games]
      summary: Get game stats summary
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Game stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        clerkId:
          type: string
        username:
          type: string
        displayName:
          type: string
          nullable: true
        avatarPath:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, player]
        tribeId:
          type: ["integer", "null"]
        tribeName:
          type: ["string", "null"]
        tribeCode:
          type: ["string", "null"]
        notifyChat:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - clerkId
        - username
        - role
        - createdAt
        - avatarPath

    AdminUser:
      type: object
      properties:
        id:
          type: integer
        clerkId:
          type: string
        username:
          type: string
        displayName:
          type: string
          nullable: true
        avatarPath:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        tribeId:
          type: integer
          nullable: true
        tribeName:
          type: string
          nullable: true
        tribeCode:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, player]
        createdAt:
          type: string
        authProvider:
          type: string
          enum: [clerk, mobile]
      required:
        - id
        - clerkId
        - username
        - email
        - avatarPath
        - tribeId
        - tribeName
        - tribeCode
        - role
        - createdAt
        - authProvider

    ListAdminUsersResponse:
      type: array
      items:
        $ref: "#/components/schemas/AdminUser"

    UpdateAdminUserRoleBody:
      type: object
      properties:
        role:
          type: string
          enum: [admin, player]
      required:
        - role

    UpdateMyAvatarBody:
      type: object
      properties:
        avatarPath:
          type: ["string", "null"]
      required:
        - avatarPath

    SignUpBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        username:
          type: string
          minLength: 1
      required:
        - email
        - password
        - username

    SignInBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - token
        - user

    ForgotPasswordBody:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email

    ForgotPasswordResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    ResetPasswordBody:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 6
          maxLength: 6
        newPassword:
          type: string
          minLength: 8
      required:
        - email
        - code
        - newPassword

    UpdateProfileBody:
      type: object
      properties:
        displayName:
          type: string
      required:
        - displayName

    PushTokenBody:
      type: object
      properties:
        token:
          type: string
          minLength: 1
      required:
        - token

    UpdateNotificationSettingsBody:
      type: object
      properties:
        notifyChat:
          type: boolean
      required:
        - notifyChat

    BroadcastBody:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
          minLength: 1
      required:
        - body

    BroadcastResult:
      type: object
      properties:
        recipients:
          type: integer
      required:
        - recipients

    UpdateRoleBody:
      type: object
      properties:
        role:
          type: string
          enum: [admin, player]
      required:
        - role

    DeleteResult:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    Game:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [setup, active, completed]
        survivorWinnerContestantId:
          type: ["integer", "null"]
        finalThreeContestantId1:
          type: ["integer", "null"]
        finalThreeContestantId2:
          type: ["integer", "null"]
        finalThreeContestantId3:
          type: ["integer", "null"]
        currentWeekNumber:
          type: integer
        totalWeeks:
          type: integer
        firstPickPoints:
          type: integer
        secondPickPoints:
          type: integer
        firstPickTopThreePoints:
          type: integer
        secondPickTopThreePoints:
          type: integer
        reminderLeadMinutes:
          type: integer
        remindOnlyMissing:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - name
        - status
        - survivorWinnerContestantId
        - finalThreeContestantId1
        - finalThreeContestantId2
        - finalThreeContestantId3
        - currentWeekNumber
        - totalWeeks
        - firstPickPoints
        - secondPickPoints
        - firstPickTopThreePoints
        - secondPickTopThreePoints
        - reminderLeadMinutes
        - remindOnlyMissing
        - createdAt

    CreateGameBody:
      type: object
      properties:
        name:
          type: string
        totalWeeks:
          type: integer
      required:
        - name
        - totalWeeks

    UpdateGameBody:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [setup, active, completed]
        firstPickPoints:
          type: integer
        secondPickPoints:
          type: integer
        firstPickTopThreePoints:
          type: integer
        secondPickTopThreePoints:
          type: integer
        reminderLeadMinutes:
          type: integer
        remindOnlyMissing:
          type: boolean

    Contestant:
      type: object
      properties:
        id:
          type: integer
        gameId:
          type: integer
        name:
          type: string
        headshotPath:
          type: ["string", "null"]
        showTribeId:
          type: ["integer", "null"]
        showTribeName:
          type: ["string", "null"]
        showTribeColor:
          type: ["string", "null"]
        isActive:
          type: boolean
          description: When false, the contestant is archived and excluded from new picks but kept for historical scoring.
        createdAt:
          type: string
      required:
        - id
        - gameId
        - name
        - headshotPath
        - showTribeId
        - showTribeName
        - showTribeColor
        - isActive
        - createdAt

    ShowTribe:
      type: object
      properties:
        id:
          type: integer
        gameId:
          type: integer
        name:
          type: string
        color:
          type: ["string", "null"]
          description: Optional display hex color (e.g. "#e11d48") shown wherever the tribe appears.
        createdAt:
          type: string
      required:
        - id
        - gameId
        - name
        - color
        - createdAt

    CreateShowTribeBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        color:
          type: ["string", "null"]
          pattern: "^#[0-9a-fA-F]{6}$"
      required:
        - name

    DeleteContestantResponse:
      type: object
      properties:
        deleted:
          type: boolean
          description: True when the contestant was hard-deleted (no historical references).
        archived:
          type: boolean
          description: True when the contestant was soft-deleted because picks or answers reference them.
      required:
        - deleted
        - archived

    CreateContestantBody:
      type: object
      properties:
        name:
          type: string
        showTribeId:
          type: ["integer", "null"]
      required:
        - name

    UpdateContestantBody:
      type: object
      properties:
        name:
          type: string
        headshotPath:
          type: ["string", "null"]
        showTribeId:
          type: ["integer", "null"]

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"

    Week:
      type: object
      properties:
        id:
          type: integer
        gameId:
          type: integer
        weekNumber:
          type: integer
        isLocked:
          type: boolean
        isOpen:
          type: boolean
        airDate:
          type: ["string", "null"]
        reminderSentAt:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - gameId
        - weekNumber
        - isLocked
        - isOpen
        - airDate
        - reminderSentAt
        - createdAt

    CreateWeekBody:
      type: object
      properties:
        weekNumber:
          type: integer
      required:
        - weekNumber

    UpdateWeekBody:
      type: object
      properties:
        airDate:
          type: ["string", "null"]
          description: ISO timestamp of when the episode airs, or null to clear it (also resets the reminder).

    Choice:
      type: object
      properties:
        id:
          type: integer
        questionId:
          type: integer
        choiceText:
          type: string
      required:
        - id
        - questionId
        - choiceText

    QuestionWithChoices:
      type: object
      properties:
        id:
          type: integer
        weekId:
          type: integer
        text:
          type: string
        pointValue:
          type: integer
        answerType:
          type: string
          enum: [cast, tribe]
          description: Which answer bank this question uses — contestants (cast) or show tribes.
      required:
        - id
        - weekId
        - text
        - pointValue
        - answerType

    CreateQuestionBody:
      type: object
      properties:
        text:
          type: string
        pointValue:
          type: integer
        answerType:
          type: string
          enum: [cast, tribe]
          default: cast
        choices:
          type: array
          items:
            type: string
      required:
        - text
        - pointValue

    UpdateQuestionBody:
      type: object
      properties:
        text:
          type: string
        pointValue:
          type: integer
        answerType:
          type: string
          enum: [cast, tribe]

    CreateChoiceBody:
      type: object
      properties:
        choiceText:
          type: string
      required:
        - choiceText

    CorrectAnswer:
      type: object
      properties:
        id:
          type: integer
        questionId:
          type: integer
        contestantId:
          type: ["integer", "null"]
        contestantName:
          type: ["string", "null"]
        showTribeId:
          type: ["integer", "null"]
        showTribeName:
          type: ["string", "null"]
        showTribeColor:
          type: ["string", "null"]
        answerName:
          type: string
          description: Display name of the correct answer (contestant or show tribe).
        questionText:
          type: string
        pointValue:
          type: integer
      required:
        - id
        - questionId
        - contestantId
        - contestantName
        - showTribeId
        - showTribeName
        - showTribeColor
        - answerName
        - questionText
        - pointValue

    SubmitCorrectAnswersBody:
      type: object
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/CorrectAnswerInput"
      required:
        - answers

    CorrectAnswerInput:
      type: object
      properties:
        questionId:
          type: integer
        contestantIds:
          type: array
          items:
            type: integer
        showTribeIds:
          type: array
          items:
            type: integer
      required:
        - questionId

    PlayerAnswer:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        questionId:
          type: integer
        contestantId:
          type: ["integer", "null"]
        contestantName:
          type: ["string", "null"]
        showTribeId:
          type: ["integer", "null"]
        showTribeName:
          type: ["string", "null"]
        showTribeColor:
          type: ["string", "null"]
        answerName:
          type: string
          description: Display name of the chosen answer (contestant or show tribe).
        isCorrect:
          type: ["boolean", "null"]
      required:
        - id
        - userId
        - questionId
        - contestantId
        - contestantName
        - showTribeId
        - showTribeName
        - showTribeColor
        - answerName
        - isCorrect

    SaveAnswersBody:
      type: object
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/PlayerAnswerInput"
      required:
        - answers

    PlayerAnswerInput:
      type: object
      properties:
        questionId:
          type: integer
        contestantId:
          type: integer
        showTribeId:
          type: integer
      required:
        - questionId

    SurvivorPicks:
      type: object
      properties:
        id:
          type: ["integer", "null"]
        userId:
          type: ["integer", "null"]
        gameId:
          type: integer
        firstChoiceContestantId:
          type: ["integer", "null"]
        secondChoiceContestantId:
          type: ["integer", "null"]
        firstChoiceName:
          type: ["string", "null"]
        secondChoiceName:
          type: ["string", "null"]
        isLocked:
          type: boolean
      required:
        - id
        - userId
        - gameId
        - firstChoiceContestantId
        - secondChoiceContestantId
        - firstChoiceName
        - secondChoiceName
        - isLocked

    SaveSurvivorPicksBody:
      type: object
      properties:
        firstChoiceContestantId:
          type: integer
        secondChoiceContestantId:
          type: integer
        lock:
          type: boolean
          description: When true, the picks are permanently locked and can no longer be changed.
      required:
        - firstChoiceContestantId
        - secondChoiceContestantId

    SubmitSurvivorWinnerBody:
      type: object
      properties:
        winnerContestantId:
          type: integer
        finalThreeContestantIds:
          type: array
          items:
            type: integer
          minItems: 3
          maxItems: 3
      required:
        - winnerContestantId
        - finalThreeContestantIds

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        userId:
          type: integer
        username:
          type: string
        displayName:
          type: string
          nullable: true
        avatarPath:
          type: ["string", "null"]
        tribeName:
          type: ["string", "null"]
        totalPoints:
          type: integer
        weeklyPoints:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyPoints"
        survivorPickPoints:
          type: integer
      required:
        - rank
        - userId
        - username
        - avatarPath
        - tribeName
        - totalPoints
        - weeklyPoints
        - survivorPickPoints

    Tribe:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
        createdByUserId:
          type: ["integer", "null"]
        memberCount:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - name
        - code
        - createdByUserId
        - memberCount
        - createdAt

    MyTribeResponse:
      type: object
      properties:
        tribe:
          oneOf:
            - $ref: "#/components/schemas/Tribe"
            - type: "null"
      required:
        - tribe

    CreateTribeBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
      required:
        - name

    JoinTribeBody:
      type: object
      properties:
        code:
          type: string
          minLength: 5
          maxLength: 5
      required:
        - code

    ChatMessage:
      type: object
      properties:
        id:
          type: integer
        tribeId:
          type: integer
        userId:
          type: integer
        username:
          type: string
        displayName:
          type: ["string", "null"]
        avatarPath:
          type: ["string", "null"]
        body:
          type: string
        createdAt:
          type: string
      required:
        - id
        - tribeId
        - userId
        - username
        - displayName
        - avatarPath
        - body
        - createdAt

    SendTribeMessageBody:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1000
      required:
        - body

    WeeklyPoints:
      type: object
      properties:
        weekNumber:
          type: integer
        points:
          type: integer
      required:
        - weekNumber
        - points

    GameStats:
      type: object
      properties:
        totalPlayers:
          type: integer
        lockedWeeks:
          type: integer
        openWeeks:
          type: integer
        topPlayer:
          type: ["string", "null"]
        topPlayerPoints:
          type: ["integer", "null"]
      required:
        - totalPlayers
        - lockedWeeks
        - openWeeks
        - topPlayer
        - topPlayerPoints
