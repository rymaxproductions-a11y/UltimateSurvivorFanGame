kind = "mobile"
previewPath = "/survivor-mobile/"
title = "Ultimate Survivor Fan Game (Mobile)"
version = "1.0.0"
id = "artifacts/survivor-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/survivor-mobile/" ]
localPort = 25817

[services.development]
run = "pnpm --filter @workspace/survivor-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/survivor-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/survivor-mobile", "run", "serve" ]

[services.env]
PORT = "25817"
BASE_PATH = "/survivor-mobile/"
