<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <style>
      html, body { overflow-x: hidden; max-width: 100vw; }
      /* Force every Clerk element to fit within the mobile viewport */
      .cl-rootBox,
      .cl-cardBox,
      .cl-card,
      .cl-main,
      .cl-header,
      .cl-footer,
      .cl-footerAction,
      .cl-form,
      .cl-signIn-root,
      .cl-signUp-root {
        width: 100% !important;
        max-width: 100vw !important;
        min-width: 0 !important;
        box-sizing: border-box !important;
      }
      @media (min-width: 640px) {
        .cl-cardBox {
          max-width: 440px !important;
          border-radius: 1rem !important;
          box-shadow: 0 4px 24px rgba(0,0,0,0.08) !important;
          border: 1px solid hsl(140 10% 85%) !important;
        }
      }
    </style>
    <title>Survivor Guessing Game</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
